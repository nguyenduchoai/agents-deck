; vimate-s3-lcd: Vimate's S3 LCD boards (3.5" ST77922, 2.5" ILI9341) as
; Deck Link boards. ESP-IDF on FreeRTOS, LVGL 9 for the screen.
;
; The Deck Link kit is an ESP-IDF component (EXTRA_COMPONENT_DIRS in
; CMakeLists.txt); LVGL comes from the ESP-IDF component registry
; (src/idf_component.yml). Settings are in sdkconfig.defaults.

[platformio]
default_envs = vimate

[env:vimate]
platform = espressif32 @ 6.8.1
board = esp32-s3-devkitc-1
framework = espidf
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
monitor_speed = 115200
; esptool 4.8: older ones lose the board mid-upload over the S3's own USB
platform_packages = platformio/tool-esptoolpy @ 1.40801.0
extra_scripts = pre:esptool_deps.py

; For development: the USB port also takes "!snap" (dumps the screen),
; "!tap x y" and "!drag x1 y1 x2 y2" (see src/debug.h). Not for daily use.
[env:vimate-debug]
extends = env:vimate
build_flags = -DPANEL_DEBUG

; The S3 2.5" board (ILI9341 240x320 upright, FT6236 touch).
[env:vimate25]
extends = env:vimate
build_flags = -DBOARD_VIMATE_25

[env:vimate25-debug]
extends = env:vimate25
build_flags = -DBOARD_VIMATE_25 -DPANEL_DEBUG
